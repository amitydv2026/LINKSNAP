name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linksnap
          POSTGRES_PASSWORD: linksnap
          POSTGRES_DB: linksnap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linksnap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Build Docker image
        run: docker build -t linksnap-api .

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://linksnap:linksnap@localhost:5432/linksnap
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://linksnap:linksnap@localhost:5432/linksnap
        run: pytest -v
