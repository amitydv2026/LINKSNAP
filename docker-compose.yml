services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linksnap
      POSTGRES_PASSWORD: linksnap
      POSTGRES_DB: linksnap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linksnap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://linksnap:linksnap@db:5432/linksnap
      SECRET_KEY: change-this-in-production
      LRU_CACHE_SIZE: "10000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
